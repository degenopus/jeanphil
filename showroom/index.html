<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jean Phil — 3D Room</title>
    <link rel="stylesheet" crossorigin href="./assets/index-C4N999gD.css">
    <style>
      /* Holder gate — the showroom app boots only after NFT verification */
      #gate {
        position: fixed; inset: 0; z-index: 1000; background: #0a0a0a; color: #ffffff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #gate h1 { font-size: 20px; letter-spacing: 0.3em; font-weight: 600; margin: 0; }
      #gate .sub { color: #999999; font-size: 13px; line-height: 1.7; margin: 0; max-width: 440px; }
      #gateWallets { display: flex; flex-direction: column; gap: 10px; width: min(320px, 86vw); margin-top: 10px; }
      #gateWallets button {
        background: #ffffff; color: #000000; border: 0; border-radius: 10px;
        padding: 13px 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      #gateWallets button:hover { background: #dddddd; }
      #gateWallets button:disabled { opacity: 0.4; cursor: default; }
      #gateStatus { font-size: 12px; color: #bbbbbb; min-height: 16px; margin: 0; }
      #gateStatus.err { color: #ff8080; }
      #gate .foot { font-size: 11px; color: #666666; margin: 0; }
      #gate .foot a { color: #bbbbbb; }
      .spin { display: inline-block; animation: gspin 0.9s linear infinite; }
      @keyframes gspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="gate">
      <h1>JEAN PHIL</h1>
      <p class="sub">The 3D showroom is for holders.<br>Connect a wallet that owns a Jean Phil NFT to enter.</p>
      <div id="gateWallets"><p id="gateMsg" class="sub">Looking for wallets…</p></div>
      <p id="gateStatus"></p>
      <p class="foot">No Jean Phil yet? <a href="https://opensea.io/collection/jeanphil-nft" target="_blank" rel="noopener">Get one on OpenSea</a></p>
    </div>
    <script>
    (function () {
      // TEMP dev preview hook — removed after visual check
      window.addEventListener("error", function (e) { sessionStorage.setItem("jp_err", String(e.message || e.error)); });
      window.addEventListener("unhandledrejection", function (e) { sessionStorage.setItem("jp_err", "rej: " + String(e.reason && e.reason.message || e.reason)); });
      var __dev = new URLSearchParams(location.search).get("jp_dev");
      if (__dev) {
        sessionStorage.removeItem("jp_err");
        sessionStorage.setItem("jp_holder", "0x0000000000000000000000000000000000000001");
        sessionStorage.setItem("jp_nft_id", "565");
        sessionStorage.setItem("jp_nft_img", "https://jeanphil.art/showroom/nfts/0777.png");
        location.href = location.pathname;
        return;
      }
      if (sessionStorage.getItem("jp_err")) { document.title = "ERR " + sessionStorage.getItem("jp_err").slice(0, 120); }
      var BUNDLE = "./assets/index-rqZhcz-m.js";
      var API = "https://jeanphil-banner.jeanphilnft.workers.dev";
      var gate = document.getElementById("gate");
      var walletsEl = document.getElementById("gateWallets");
      var statusEl = document.getElementById("gateStatus");
      var msgEl = document.getElementById("gateMsg");

      function boot() {
        gate.style.display = "none";
        var s = document.createElement("script");
        s.type = "module"; s.crossOrigin = "anonymous"; s.src = BUNDLE;
        document.body.appendChild(s);
      }
      function setBusy(b) {
        var btns = walletsEl.querySelectorAll("button");
        for (var i = 0; i < btns.length; i++) btns[i].disabled = b;
      }
      function fail(m) { msgEl.textContent = ""; statusEl.textContent = m; statusEl.className = "err"; }

      // already verified on jeanphil.art this session — if we don't have the
      // holder's NFT image yet, fetch it (it goes on the showroom wall), then boot
      function loadable(url) {
        return new Promise(function (res) {
          var im = new Image();
          im.crossOrigin = "anonymous";
          im.onload = function () { res(true); };
          im.onerror = function () { res(false); };
          im.src = url;
        });
      }
      async function pickNft(toks) {
        for (var i = 0; i < Math.min(toks.length, 8); i++) {
          var t = toks[i];
          if (t && t.imageUrl && await loadable(t.imageUrl)) return t;
        }
        return null;
      }
      function rememberNft(t) {
        if (!t) return;
        sessionStorage.setItem("jp_nft_id", t.tokenId);
        sessionStorage.setItem("jp_nft_img", t.imageUrl);
      }
      if (sessionStorage.getItem("jp_holder")) {
        if (sessionStorage.getItem("jp_nft_img")) { boot(); return; }
        fetch(API + "/api/nfts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ address: sessionStorage.getItem("jp_holder") }) })
          .then(function (r) { return r.json(); })
          .then(function (d) { return pickNft((d && d.tokens) || []); })
          .then(rememberNft)
          .catch(function () {})
          .finally(boot);
        return;
      }

      var providers = [];
      function rank(p) {
        var s = String((p.info && (p.info.rdns || p.info.name)) || "").toLowerCase();
        if (s.indexOf("metamask") !== -1) return 0;
        if (s.indexOf("trust") !== -1) return 1;
        return 2;
      }
      var onAnn = function (e) {
        var p = e.detail && e.detail.provider, i = e.detail && e.detail.info;
        if (!p) return;
        // Phantom is Solana-first — never offer it for EVM login here
        if (i && /phantom/i.test(i.rdns || "")) return;
        try { if (!p.info) p.info = i; } catch (err) {}
        if (providers.indexOf(p) === -1) providers.push(p);
      };
      window.addEventListener("eip6963:announceProvider", onAnn);
      window.dispatchEvent(new Event("eip6963:requestProvider"));

      setTimeout(function () {
        window.removeEventListener("eip6963:announceProvider", onAnn);
        var we = window.ethereum;
        if (we && providers.indexOf(we) === -1) {
          try { if (!we.info) we.info = { name: we.isMetaMask ? "MetaMask" : "Browser wallet" }; } catch (e) {}
          providers.push(we);
        }
        providers.sort(function (a, b) { return rank(a) - rank(b); });
        msgEl.textContent = "";
        if (!providers.length) {
          fail("No wallet detected. Open this page inside MetaMask or Trust Wallet mobile browser, or install a wallet extension.");
          return;
        }
        providers.forEach(function (p) {
          var name = (p.info && p.info.name) || "Browser wallet";
          var b = document.createElement("button");
          b.textContent = "Connect " + name;
          b.onclick = function () { connect(p); };
          walletsEl.appendChild(b);
        });
      }, 900);

      async function connect(p) {
        setBusy(true);
        statusEl.className = "";
        statusEl.innerHTML = '<span class="spin">&#9696;</span> Waiting for the wallet…';
        try {
          var accs = await p.request({ method: "eth_requestAccounts" });
          if (!accs || !accs[0]) throw new Error("No account returned");
          statusEl.textContent = "Verifying your Jean Phils…";
          var r = await fetch(API + "/api/nfts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: accs[0] }),
          });
          var d = await r.json().catch(function () { return {}; });
          if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
          var toks = d.tokens || [];
          if (!toks.length) throw new Error("No Jean Phil NFT found in this wallet — you need one to enter the showroom.");
          sessionStorage.setItem("jp_holder", accs[0]);
          rememberNft(await pickNft(toks));
          statusEl.className = "";
          statusEl.textContent = "Welcome in, holder.";
          setTimeout(boot, 450);
        } catch (e) {
          setBusy(false);
          fail(e.message || "Connection failed");
        }
      }
    })();
    </script>
  </body>
</html>
